name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag on main (vX.Y.Z or vX.Y.Z-prerelease)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # GitHub only lists draft releases for callers with push access.
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate existing tag and draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/prepare_release.py

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply release version
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Verify complete repository at release version
        run: mvn -B clean install -Pcli-distribution -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Record CLI archive checksums
        run: python3 .github/scripts/release_assets.py asyncapi-generator-cli/target "$RELEASE_VERSION" --write

      - name: Retain CLI distributions for release smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: release-cli-distributions
          path: |
            asyncapi-generator-cli/target/asyncapi-generator-*-bin.tar.gz
            asyncapi-generator-cli/target/asyncapi-generator-*-bin.zip
            asyncapi-generator-cli/target/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  maven-central:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 21 and Maven publication credentials
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Apply release version
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Publish Maven artifacts and wait for PUBLISHED
        id: publish
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mvn -B clean deploy -P release
          -pl asyncapi-generator-core,asyncapi-generator-cli,asyncapi-generator-maven-plugin -am
          -DskipTests -Dinvoker.skip=true
          -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          -Dorg.slf4j.simpleLogger.log.org.jetbrains.dokka=warn

      - name: Explain publication recovery
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Maven Central publication failed. Inspect the deployment ID in the logs and its state in the Central Portal before retrying: a timeout can occur after upload or publication. Resume or reconcile that deployment first. Do not rerun successful publication jobs or enable ignorePublishedComponents to hide a partial release.
          EOF

  gradle-central:
    needs: [prepare, verify, maven-central]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply release version
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Install core for the Gradle publication build
        run: mvn -B install -pl asyncapi-generator-core -am -DskipTests -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Publish Gradle plugin and marker through Sonatype
        id: publish
        working-directory: asyncapi-generator-gradle-plugin
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          OSSRH_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          OSSRH_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew --no-daemon -PasyncApiGeneratorVersion="$RELEASE_VERSION" publishToSonatype closeAndReleaseSonatypeStagingRepository

      - name: Explain publication recovery
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Gradle Central publication failed. Inspect the staging repository ID and Central Portal deployment before retrying. publishToSonatype starts a new staging repository; it does not resume an earlier upload. Reconcile the existing staging/deployment state first and rerun only the failed destination when safe.
          EOF

  gradle-portal:
    needs: [prepare, verify, maven-central]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply release version
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Install core for the Gradle publication build
        run: mvn -B install -pl asyncapi-generator-core -am -DskipTests -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Publish Gradle Plugin Portal destination
        id: publish
        working-directory: asyncapi-generator-gradle-plugin
        env:
          OSSRH_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          OSSRH_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew --no-daemon -PasyncApiGeneratorVersion="$RELEASE_VERSION" publishPlugins

      - name: Explain publication recovery
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Gradle Plugin Portal publication failed. Inspect the portal version and approval/upload state before retrying this destination. Activated versions cannot be replaced. Keep successful Central publication jobs completed.
          EOF

  published-artifacts:
    needs: [prepare, maven-central, gradle-central, gradle-portal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        destination: [maven, gradle-central, gradle-portal]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SMOKE_DESTINATION: ${{ matrix.destination }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 21 without dependency caches
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Resolve and execute published artifacts using empty caches
        run: sh .github/scripts/test-published-artifacts.sh "$RELEASE_VERSION" "$SMOKE_DESTINATION"

  cli-distributions:
    needs: [prepare, verify, maven-central, gradle-central, gradle-portal]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download verified CLI distributions
        uses: actions/download-artifact@v5
        with:
          name: release-cli-distributions
          path: release-assets

      - name: Verify archive checksums
        shell: bash
        run: python .github/scripts/release_assets.py release-assets "$RELEASE_VERSION"

      - name: Test Unix distribution
        if: runner.os == 'Linux'
        shell: bash
        run: sh .github/scripts/test-cli-distribution.sh "release-assets/asyncapi-generator-$RELEASE_VERSION-bin.tar.gz" "$RELEASE_VERSION"

      - name: Test Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-cli-distribution.ps1 -Archive "release-assets/asyncapi-generator-${env:RELEASE_VERSION}-bin.zip" -Version $env:RELEASE_VERSION

  finalize:
    needs: [prepare, verify, maven-central, gradle-central, gradle-portal, published-artifacts, cli-distributions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
      ASSET_DIRECTORY: release-assets
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download tested CLI distributions
        uses: actions/download-artifact@v5
        with:
          name: release-cli-distributions
          path: release-assets

      - name: Attach tested assets and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/finalize_release.py
