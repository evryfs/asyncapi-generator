site_name: AsyncAPI Generator
site_description: Documentation for the AsyncAPI Generator project
site_url: https://evryfs.github.io/asyncapi-generator/
repo_url: https://github.com/evryfs/asyncapi-generator
repo_name: evryfs/asyncapi-generator
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: readthedocs

plugins:
  - search

nav:
  - Home: index.md
  - Tutorials:
      - Getting started: tutorials/getting-started.md
  - How-to:
      - Maven: how-to/maven.md
      - Gradle: how-to/gradle.md
      - CLI: how-to/cli.md
      - Load an AsyncAPI document: how-to/load-asyncapi-document.md
      - Generate Kotlin models: how-to/generate-kotlin-models.md
      - Generate Spring Kafka clients: how-to/generate-spring-kafka-clients.md
      - Generate Avro schemas: how-to/generate-avro-schemas.md
      - Generate Protobuf schemas: how-to/generate-protobuf-schemas.md
      - Generate JSON schemas: how-to/generate-json-schemas.md
      - Bundle multi-file documents: how-to/bundle-multi-file-documents.md
  - Reference:
      - Reader contract: reference/reader-contract.md
      - Parser contract: reference/parser-contract.md
      - Validation rules: reference/validation-rules.md
      - Generator configuration: reference/generator-configuration.md
      - Generated output examples: reference/generated-output-examples.md
      - YAML output: reference/yaml-output.md
  - Explanation:
      - Architecture overview: explanation/architecture.md
      - Reader: explanation/reader.md
      - Parser: explanation/parser.md
      - Validator: explanation/validator.md
      - Bundler: explanation/bundler.md
      - Generator: explanation/generator.md
      - Schema formats: explanation/schema-formats.md
  - Contributing:
      - Development setup: contributing/development-setup.md
      - Adding a validation rule: contributing/adding-validation-rule.md
      - Changing the parser: contributing/changing-the-parser.md
      - Documentation: contributing/documentation.md
      - KDoc style guide: contributing/kdoc-style-guide.md
  - Coverage: coverage/index.md
