asyncapi: 3.0.0
info:
  # Missing 'title' and 'version' which are mandatory
  description: "Info with missing fields"
components:
  schemas:
    InvalidTypeSchema:
      # 'type' should be string or list of strings (in some versions), but here we test a number
      type: 123

    InvalidEnumSchema:
      type: string
      # 'enum' should be a list
      enum: "not-a-list"

    MissingDependenciesObject:
      type: object
      # dependencies should be an object/map
      dependencies: ["wrong", "type"]

    InvalidTypeArraySchema:
      type: [string, 7]

    NullReferenceSchema:
      $ref: null

    InvalidSchemaUri:
      $schema: false

    InvalidExclusiveMaximum:
      exclusiveMaximum: "10"

    InvalidDiscriminator:
      discriminator:
        propertyName: eventType

    InvalidAllOf:
      allOf:
        invalid:
          type: string

    TupleItemsSchema:
      type: array
      items:
        - type: string
        - type: number

    InvalidDependencyScalar:
      type: object
      dependencies:
        name: not-a-schema-or-property-list

    InvalidDependencyNull:
      type: object
      dependencies:
        name: null

  schemaCases:
    ArrayInsteadOfMap:
      - type: string
    ObjectInsteadOfList:
      schema:
        type: string
