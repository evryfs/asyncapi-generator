asyncapi: 3.0.0
info:
  title: Message Trait Validation
  version: 1.0.0
channels: {}
components:
  messageTraits:
    # Case 1: Invalid Content Type (Error)
    InvalidContentType:
      contentType: "invalid-type" # Missing '/'
      headers:
        type: object

    # Case 2: Empty Trait (Warning)
    EmptyTrait: {}

    # Case 3: Example without headers or payload (Error)
    InvalidExample:
      headers:
        type: object
      examples:
        - name: metadataOnly
          summary: Does not contain message data
