asyncapi: 3.0.0
info:
  title: Valid Security Schemes
  version: 1.0.0
components:
  securitySchemes:
    UserPassword:
      type: userPassword
    ApiKey:
      type: apiKey
      in: user
    HttpApiKey:
      type: httpApiKey
      name: X-API-Key
      in: header
    BearerWithoutDocumentationHint:
      type: http
      scheme: bearer
    OAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://example.com/authorize
          availableScopes: {}
        password:
          tokenUrl: https://example.com/token
          availableScopes: {}
        clientCredentials:
          tokenUrl: https://example.com/token
          availableScopes: {}
        authorizationCode:
          authorizationUrl: https://example.com/authorize
          tokenUrl: https://example.com/token
          refreshUrl: https://example.com/refresh
          availableScopes: {}
      scopes: []
    OpenId:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
      scopes: []
