asyncapi: 3.0.0
info:
  title: Valid Operation Boundaries
  version: 1.0.0
channels:
  requests:
    messages:
      shared:
        $ref: '#/components/messages/shared'
  replies:
    messages:
      reply:
        $ref: '#/components/messages/reply'
components:
  channels:
    componentChannel:
      messages:
        shared:
          $ref: '#/components/messages/shared'
  messages:
    shared:
      payload: true
    reply:
      payload: true
  operations:
    ComponentOperation:
      action: receive
      channel:
        $ref: '#/components/channels/componentChannel'
      messages:
        - $ref: '#/components/channels/componentChannel/messages/shared'
  operationTraits:
    DocumentedTrait:
      description: Documentation is meaningful trait content
operations:
  RootOperation:
    action: send
    channel:
      $ref: '#/channels/requests'
    messages:
      - $ref: '#/channels/requests/messages/shared'
    traits:
      - $ref: '#/components/operationTraits/DocumentedTrait'
    reply:
      address:
        location: '$message.header#/replyTo'
      channel:
        $ref: '#/channels/replies'
      messages:
        - $ref: '#/channels/replies/messages/reply'
