asyncapi: "3.0.0"
info:
  title: "Mutually recursive external schema bundling"
  version: "1.0.0"
channels:
  relationshipEvents:
    address: "relationship.events"
    messages:
      relationshipUpdated:
        payload:
          $ref: "#/components/schemas/ParentNode"
        name: "RelationshipUpdated"
components:
  schemas:
    ParentNode:
      type: "object"
      required:
        - "child"
      properties:
        child:
          $ref: "#/components/schemas/ChildNode"
    ChildNode:
      type: "object"
      required:
        - "parent"
      properties:
        parent:
          $ref: "#/components/schemas/ParentNode"
