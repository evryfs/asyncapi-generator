asyncapi: 3.0.0
info:
  title: Recursive external schema root collision
  version: 1.0.0
channels:
  externalTreeEvents:
    address: external.tree.events
    messages:
      externalTreeUpdated:
        name: ExternalTreeUpdated
        payload:
          $ref: './external-tree.yaml#/components/schemas/TreeNode'
