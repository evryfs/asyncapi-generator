plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.asyncapi.generator)
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.jakarta.validation.api
    implementation libs.jackson.annotations
    implementation libs.spring.kafka
    testImplementation libs.kotlin.test.junit5
    testImplementation libs.junit.jupiter
    testImplementation libs.jackson.databind
    testImplementation libs.jackson.dataformat.yaml
    testImplementation libs.jackson.module.kotlin
    testRuntimeOnly libs.junit.platform.launcher
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
}

asyncApiGenerator {
    clientConfig {
        clientType = 'spring-kafka'
        clientContract = 'interface'
        producer {
            enabled = true
        }
        consumer {
            enabled = true
        }
        topicParameterProperties.put('environment', 'kafka.environment')
        validationAnnotations {
            clientContract = 'org.springframework.validation.annotation.Validated'
            payloadParameter = 'jakarta.validation.Valid'
        }
    }
    executions {
        register('reference-forms') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/reference-forms/asyncapi.yaml')
            modelPackage = 'com.example.references.model'
            clientPackage = 'com.example.references.client'
        }
        register('external-message') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/external-message/asyncapi.yaml')
            modelPackage = 'com.example.message.model'
            clientPackage = 'com.example.message.client'
        }
        register('message-models') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/message-models/main.yaml')
            outputFile = layout.projectDirectory.file('bundles/message-models.yaml')
            modelPackage = 'com.example.external.model'
            clientPackage = 'com.example.external.client'
        }
        register('recursive-kotlin') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/recursive/asyncapi.yaml')
            outputFile = layout.projectDirectory.file('bundles/recursive-kotlin.yaml')
            modelPackage = 'com.example.recursive.kotlin'
        }
        register('recursive-java') {
            generatorName = 'java'
            inputSpec = file('src/main/asyncapi/recursive/asyncapi.yaml')
            outputFile = layout.projectDirectory.file('bundles/recursive-java.yaml')
            modelPackage = 'com.example.recursive.java'
        }
    }
}
