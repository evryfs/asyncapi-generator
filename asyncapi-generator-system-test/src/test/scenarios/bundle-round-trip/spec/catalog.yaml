components:
  parameters:
    Region:
      description: Region the order was placed in
      enum: [eu, us]
      x-parameter-note: region-value
  tags:
    Orders:
      name: orders
      description: Order related operations
      x-tag-note: tag-value
  messages:
    OrderPlaced:
      name: OrderPlaced
      x-message-note: message-value
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/OrderKey'
          bindingVersion: 0.4.0
      payload:
        $ref: '#/components/schemas/OrderPlacedPayload'
  schemas:
    OrderKey:
      type: string
      description: Identifies the order record
    OrderPlacedPayload:
      type: object
      properties:
        orderId:
          type: string
        total:
          $ref: 'types.yaml#/components/schemas/Order/properties/total'
        order:
          $ref: 'types.yaml#/components/schemas/Order'
        ledger:
          $ref: 'left/shared.yaml#/Outer'
