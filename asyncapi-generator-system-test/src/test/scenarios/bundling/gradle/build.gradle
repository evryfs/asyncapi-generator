plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.asyncapi.generator)
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.jakarta.validation.api
    implementation libs.jackson.annotations
    testImplementation libs.kotlin.test.junit5
    testImplementation libs.junit.jupiter
    testImplementation libs.jackson.databind
    testImplementation libs.jackson.dataformat.yaml
    testImplementation libs.jackson.module.kotlin
    testRuntimeOnly libs.junit.platform.launcher
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
}

asyncApiGenerator {
    executions {
        register('channel-fragment') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/channel-fragment/main.yaml')
            outputFile = layout.projectDirectory.file('bundles/channel-fragment.yaml')
        }
        register('schema-fragment') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/schema-fragment/main.yaml')
            outputFile = layout.projectDirectory.file('bundles/schema-fragment.yaml')
        }
        register('separate-directory') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/separate-directory/main.yaml')
            outputFile = layout.projectDirectory.file('bundles/separate-directory.yaml')
        }
        register('yaml-document') {
            generatorName = 'asyncapi-yaml'
            inputSpec = file('src/main/asyncapi/single-file/asyncapi.yaml')
            outputFile = layout.projectDirectory.file('bundles/single-file.yaml')
        }
        register('nested-output-file') {
            generatorName = 'kotlin'
            inputSpec = file('src/main/asyncapi/single-file/asyncapi.yaml')
            outputFile = layout.projectDirectory.file('bundles/nested/directories/single-file.yaml')
        }
    }
}
